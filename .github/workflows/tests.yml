name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # CNN e dataset são verificados em CPU, sem baixar modelos de linguagem.
      - run: python -m pip install -r requirements-torch-cpu.txt
      - run: python -m pip install -r requirements-numeric.txt -r requirements-dev.txt -r requirements-interface.txt
      - run: python -m unittest discover -s App -p "test_*.py" -v
