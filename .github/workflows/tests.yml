name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PyTorch e Transformers ficam fora: nenhum teste os importa.
      - run: python -m pip install -r requirements-analysis.txt -r requirements-dev.txt
      - run: python -m unittest discover -s App -p "test_*.py" -v
